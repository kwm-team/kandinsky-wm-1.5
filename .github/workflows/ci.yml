name: CPU checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install . numpy scipy av safetensors pytest ruff==0.9.10
      - run: ruff check --select E9,F63,F7,F82 base_av ucpe piflow kwm_av tests examples tools
      - run: python -m compileall -q base_av ucpe piflow kwm_av examples tools
      - run: python -m pytest -q --import-mode=importlib tests base_av/tests ucpe/tests piflow/tests
      - run: kwm-av --help
      - run: python examples/make_trajectories.py
      - run: git diff --exit-code
