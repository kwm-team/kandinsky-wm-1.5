name: CPU checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.10'
      - run: uv sync --locked --python 3.12 --group test
      - run: uv run --no-sync ruff check --select E9,F63,F7,F82 src scripts tests examples
      - run: uv run --no-sync python -m compileall -q src scripts examples
      - run: uv run --no-sync python -m pytest -q --import-mode=importlib tests
      - run: uv run --no-sync kwm-av --help
      - run: |
          for model in base_av ucpe ar f2lf; do
            uv run --no-sync python "scripts/infer_$model.py" --help
          done
      - run: uv run --no-sync python scripts/demo_ar.py --help
      - run: uv run --no-sync python examples/make_trajectories.py
      - run: git diff --exit-code
