[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kandinsky-wm-av"
version = "0.2.0"
description = "Native inference for Kandinsky WM 1.5 autonomous-driving models"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "LICENSE-APACHE"]

[project.optional-dependencies]
hub = ["huggingface-hub>=0.27"]
base-av-f2lf = [
    "accelerate==1.15.0",
    "av==12.0.0",
    "diffusers @ git+https://github.com/huggingface/diffusers.git@1e004eb6ec9435349c4a6dd6d1c44c7e0fec6b40",
    "imageio==2.37.0",
    "imageio-ffmpeg==0.6.0",
    "numpy==1.26.4",
    "omegaconf==2.3.0",
    "opencv-python-headless==4.11.0.86",
    "pillow==11.1.0",
    "safetensors==0.8.0",
    "scipy==1.15.2",
    "torch==2.7.0",
    "torchvision==0.22.0",
    "transformers==5.19.0",
]
ucpe-ar = [
    "accelerate==1.4.0",
    "av==16.1.0",
    "diffusers==0.32.2",
    "numpy==1.26.4",
    "omegaconf==2.3.0",
    "pillow==11.1.0",
    "psutil",
    "safetensors==0.5.3",
    "scipy==1.15.2",
    "torch==2.7.0",
    "torchvision==0.22.0",
    "transformers==4.49.0",
]

[project.scripts]
kwm-av = "kwm_av.cli:main"

[dependency-groups]
flash-build = ["ninja", "packaging", "psutil", "setuptools>=77,<81", "wheel"]
test = ["av", "numpy==1.26.4", "pillow", "pytest", "ruff==0.9.10", "safetensors", "scipy", "torch==2.7.0"]

[tool.uv]
default-groups = []
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
conflicts = [
    [{extra = "base-av-f2lf"}, {extra = "ucpe-ar"}],
    [{extra = "base-av-f2lf"}, {group = "test"}],
    [{extra = "ucpe-ar"}, {group = "test"}],
]

[tool.uv.sources]
torch = [
    {index = "pytorch-cpu", group = "test"},
    {index = "pytorch-cu128", extra = "base-av-f2lf"},
    {index = "pytorch-cu128", extra = "ucpe-ar"},
]
torchvision = {index = "pytorch-cu128"}

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["kwm_av*", "base_av*", "ucpe*", "ar*", "f2lf*"]
namespaces = false
